name: places-data

# 놀이터·공원·화장실 정적 데이터 빌드 → gh-pages 브랜치의 places/, index.json, meta.json
# 놀이터는 행안부 전국어린이놀이시설정보 API(좌표 포함, 약 90회 호출)로 받는다. cpf.go.kr 크롤링은 예비용(기본 꺼짐).
on:
  schedule:
    - cron: "0 18 * * 0" # 매주 월요일 03:00 KST
  workflow_dispatch:
    inputs:
      crawl:
        description: "cpf.go.kr 목록 재수집(예비, 약 45분)"
        type: boolean
        default: false
      force:
        description: "장소 수가 지난 게시본보다 20% 넘게 줄어도 게시(실제로 줄어든 것을 확인했을 때만)"
        type: boolean
        default: false

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 지난 놀이터 목록 캐시 복원
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/cpf
          key: cpf-${{ github.run_id }}
          restore-keys: cpf-
      - name: 놀이터 목록 수집(예비, cpf.go.kr)
        if: ${{ inputs.crawl }}
        run: npm run pipeline:crawl -- all
      - name: 장소 데이터 빌드
        run: npm run pipeline:places -- --out site
      - name: gh-pages 반영
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add pipeline/data/geocode.json || true
          if ! git diff --cached --quiet; then git commit -m "chore: geocode cache" && git push; fi
          git fetch origin gh-pages || true
          git worktree add pages gh-pages 2>/dev/null || (git worktree add --orphan -b gh-pages pages)
          # 종류별 장소 수가 지난 게시본보다 크게 줄었으면(API 일시 오류로 한 층이 빠짐) 게시하지 않는다
          if [ "${{ inputs.force }}" != "true" ]; then node node_modules/tsx/dist/cli.mjs pipeline/check-drop.ts pages/index.json site/index.json; fi
          rm -rf pages/places pages/index.json pages/meta.json
          cp -r site/places pages/ && cp site/index.json site/meta.json pages/
          touch pages/.nojekyll
          cd pages && git add -A && (git diff --cached --quiet || git commit -m "data: places $(date -u +%F)") && git push origin gh-pages
