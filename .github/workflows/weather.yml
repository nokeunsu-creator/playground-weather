name: weather-data

# 시군구별 날씨 스냅샷 → gh-pages 브랜치의 wx/
# 개발계정(기상청 단기예보 일 10,000건) 안에서 돌도록 1시간 간격. 운영계정 전환 후 30분 간격으로 줄여도 됨.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      mock:
        description: "모의 데이터로 생성"
        type: boolean
        default: false

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: gh-pages 체크아웃(장소 index 필요)
        run: |
          git fetch origin gh-pages
          git worktree add pages gh-pages
      - name: 날씨 수집
        run: npm run pipeline:weather -- --out pages ${{ inputs.mock && '--mock' || '' }}
      - name: gh-pages 반영
        run: |
          cd pages
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add -A wx
          git diff --cached --quiet || git commit -m "data: weather $(date -u +%FT%H:%MZ)"
          git push origin gh-pages
